<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>はじめてのAR（確認用）</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    #status {
      position: fixed; top: 8px; left: 8px; z-index: 10;
      padding: 6px 10px; border-radius: 6px;
      background: rgba(0,0,0,0.7); color: #fff;
      font: 14px sans-serif; white-space: pre-line;
    }
  </style>
</head>
<body>
  <div id="status">モデル読み込み中…</div>

  <a-scene embedded
    arjs="sourceType: webcam; debugUIEnabled: false;"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false">

    <a-assets timeout="30000">
      <a-asset-item id="scan" src="nuigurumi.glb"></a-asset-item>
    </a-assets>

    <a-marker id="marker" type="pattern" url="newmarker.patt">
      <!-- 確認用の赤い箱（半透明） -->
      <a-box position="0 0.5 0" color="#FF0000" opacity="0.5"></a-box>

      <!-- ライト -->
      <a-light type="ambient" intensity="1"></a-light>
      <a-light type="directional" position="1 2 1" intensity="1"></a-light>

      <!-- スキャンしたモデル -->
      <a-entity id="model"
                gltf-model="#scan"
                position="0 0 0"
                rotation="0 0 0"
                scale="1 1 1"></a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const status = document.getElementById('status');
    const model  = document.getElementById('model');
    const marker = document.getElementById('marker');
    let modelText  = 'モデル読み込み中…';
    let markerText = 'マーカー：未検出';
    const show = () => { status.textContent = modelText + '\n' + markerText; };

    // モデルの読み込み結果
    model.addEventListener('model-loaded', () => {
      const box  = new THREE.Box3().setFromObject(model.object3D);
      const size = box.getSize(new THREE.Vector3());
      modelText = '✅ モデル読み込み成功\n大きさ: '
        + size.x.toFixed(2) + ' × ' + size.y.toFixed(2) + ' × ' + size.z.toFixed(2);
      show();
    });
    model.addEventListener('model-error', (e) => {
      modelText = '❌ モデル読み込み失敗（ファイル名・場所・Draco圧縮を確認）';
      console.error(e.detail);
      show();
    });

    // マーカーの検出状態
    marker.addEventListener('markerFound', () => { markerText = 'マーカー：検出中 👀'; show(); });
    marker.addEventListener('markerLost',  () => { markerText = 'マーカー：見失った'; show(); });

    show();
  </script>
</body>
</html>
